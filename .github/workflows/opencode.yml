name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root_secret
          MARIADB_DATABASE: fin_test
          MARIADB_USER: fin
          MARIADB_PASSWORD: fin_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "true"
          MP_SMTP_AUTH_ALLOW_INSECURE: "true"
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd="wget --no-verbose --tries=1 --spider http://localhost:8025/api/v1/messages || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_KEY: base64:HSshncsaA9rALm2QsuYNawBNVeTu78O7+kREEgnR9j8=
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: fin_test
      DB_USERNAME: fin
      DB_PASSWORD: fin_secret
      MAIL_MAILER: smtp
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: "test@fin.local"
      MAIL_FROM_NAME: "Fin Test"

    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, bcmath
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Prepare Application Environment
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          php artisan config:clear
          php artisan migrate --force --seed

      - name: Start Laravel Development Server
        run: |
          nohup php artisan serve --port=8000 > /tmp/laravel-serve.log 2>&1 &
          disown
          echo "Waiting for app to be ready..."
          for i in $(seq 1 30); do
            if wget --no-verbose --tries=1 --spider http://localhost:8000/login 2>/dev/null; then
              echo "✅ Application is ready!"
              exit 0
            fi
            echo "Attempt $i/30 — app not ready yet, retrying in 2s..."
            sleep 2
          done
          echo "❌ Application failed to start"
          echo "--- Server log ---"
          cat /tmp/laravel-serve.log
          exit 1

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "instructions": ["AGENTS.md"],
              "permission": {
                "*": "allow",
                "read": {
                  "*": "allow",
                  "*.env": "allow",
                  "*.env.*": "allow",
                  "*.env.example": "allow"
                }
              }
            }
        with:
          model: opencode-go/longcat-2.0
