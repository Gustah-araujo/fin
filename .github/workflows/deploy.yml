name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Rsync to server
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avzr --delete --exclude-from=.rsyncignore
          path: ./
          remote_path: /var/www/fin/
          remote_host: 201.23.19.152
          remote_user: ubuntu
          remote_key: ${{ secrets.SSH_KEY }}
      - name: Deploy containers
        uses: appleboy/ssh-action@v1
        with:
          host: 201.23.19.152
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: cd /var/www/fin && chmod +x ./scripts/deploy.sh && ./scripts/deploy.sh
