name: 'Rsync Deploy'
description: 'Deploy files via rsync over SSH'
inputs:
  host:
    description: 'Remote host'
    required: true
  user:
    description: 'SSH user'
    required: true
  port:
    description: 'SSH port'
    default: '22'
  local_path:
    description: 'Local path to sync'
    required: true
  remote_path:
    description: 'Remote path to sync'
    required: true
  switches:
    description: 'Rsync flags'
    default: '-avzr --delete'
  exclude_from:
    description: 'Exclude file path'
    default: ''
  ssh_key:
    description: 'SSH private key'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup SSH
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.ssh_key }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p ${{ inputs.port }} ${{ inputs.host }} >> ~/.ssh/known_hosts 2>/dev/null

    - name: Rsync deploy
      shell: bash
      run: |
        RSYNC_CMD="rsync ${{ inputs.switches }}"
        if [ -n "${{ inputs.exclude_from }}" ]; then
          RSYNC_CMD="$RSYNC_CMD --exclude-from=${{ inputs.exclude_from }}"
        fi
        $RSYNC_CMD \
          -e "ssh -p ${{ inputs.port }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
          ${{ inputs.local_path }} \
          ${{ inputs.user }}@${{ inputs.host }}:${{ inputs.remote_path }}

    - name: Cleanup
      shell: bash
      if: always()
      run: rm -f ~/.ssh/deploy_key
